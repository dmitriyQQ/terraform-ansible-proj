---
- name: Create prometheus user
  ansible.builtin.user:
    create_home: false
    name: prometheus
    shell: "/usr/sbin/nologin"
    system: true
    state: present

- name: Check if prometheus binary exists
  ansible.builtin.stat:
    path: "/usr/local/bin/prometheus"
  register: prometheus_binary

- name: Check installed prometheus version
  ansible.builtin.command:
    cmd: /usr/local/bin/prometheus --version
  register: prometheus_installed_version
  changed_when: false
  when: prometheus_binary.stat.exists

- name: Download prometheus archive on Ansible controller
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "/tmp/{{ prometheus_archive_name }}"
    checksum: "sha256:{{ prometheus_checksum }}"
    timeout: 60
    mode: "0644"
  register: prometheus_download
  retries: 3
  delay: 5
  until: prometheus_download is succeeded
  delegate_to: localhost
  run_once: true
  become: false

- name: Install prometheus when required
  block:
    - name: Copy prometheus archive to containers
      ansible.builtin.copy:
        src: "/tmp/{{ prometheus_archive_name }}"
        dest: "/tmp/{{ prometheus_archive_name }}"
        owner: root
        group: root
        mode: "0644"

    - name: Unarchive tar to dest folder
      ansible.builtin.unarchive:
        src: "/tmp/{{ prometheus_archive_name }}"
        remote_src: true
        dest: "/tmp"

    - name: Install prometheus binary
      ansible.builtin.copy:
        src: "/tmp/{{ prometheus_archive_dir }}/prometheus"
        dest: "/usr/local/bin/prometheus"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart prometheus
    
    - name: Remove prometheus archive from container
      ansible.builtin.file:
        path: "/tmp/{{ prometheus_archive_name }}"
        state: absent
    
    - name: Remove extracted prometheus directory
      ansible.builtin.file:
        path: "/tmp/{{ prometheus_archive_dir }}"
        state: absent

  when:
    - not prometheus_binary.stat.exists or
      prometheus_version not in (prometheus_installed_version.stdout | default(''))

- name: Create directory for prometheus config
  ansible.builtin.file:
    path: "/etc/prometheus"
    state: directory
    owner: root
    group: prometheus
    mode: "0750"

- name: Create directory for prometheus TSDB
  ansible.builtin.file:
    path: "/var/lib/prometheus"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"

- name: Generate prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "/etc/prometheus/prometheus.yml"
    owner: root
    group: prometheus
    mode: "0640"
  notify: Restart prometheus

- name: Copy unit file
  ansible.builtin.copy:
    src: prometheus.service
    dest: "/etc/systemd/system/prometheus.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Enable and start prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true