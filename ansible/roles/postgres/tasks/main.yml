---
- name: Install postgresql
  ansible.builtin.apt:
    name: 
      - postgresql
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create notes user
  community.postgresql.postgresql_user:
    name: notes_user
    password: "{{ db_user_passwd }}"
    state: present
  become: true
  become_user: postgres

- name: Create database
  community.postgresql.postgresql_db:
    name: notes
    state: present
    owner: notes_user
    encoding: UTF-8
    template: template0
  become: true
  become_user: postgres

- name: Create notes table
  community.postgresql.postgresql_table:
    name: notes
    state: present
    columns:
      - id serial primary key
      - title text
      - content text
      - created_at timestamp default CURRENT_TIMESTAMP
    login_host: 127.0.0.1
    login_db: notes
    login_user: notes_user
    login_password: "{{ db_user_passwd }}"

- name: Change PostgreSQL server configs
  community.postgresql.postgresql_set:
    name: listen_addresses
    value: localhost,192.168.100.11
  become: true
  become_user: postgres
  notify: Restart postgresql

- name: Change rules in pg_hba.conf
  community.postgresql.postgresql_pg_hba:
    contype: host
    databases: notes
    users: notes_user
    address: 192.168.100.10/32
    method: scram-sha-256
    dest: /etc/postgresql/14/main/pg_hba.conf
    state: present
  notify: Reload postgresql

- name: Enable and start postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started
    daemon_reload: true