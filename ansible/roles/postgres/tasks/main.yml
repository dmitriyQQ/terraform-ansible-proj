---
- name: Install postgresql
  ansible.builtin.apt:
    name: 
      - postgresql
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create notes user
  community.postgresql.postgresql_user:
    name: "{{ postgresql_db_user }}"
    password: "{{ db_user_passwd }}"
    state: present
  become: true
  become_user: postgres

- name: Create database
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db_name }}"
    state: present
    owner: "{{ postgresql_db_user }}"
    encoding: UTF-8
    template: template0
  become: true
  become_user: postgres

- name: Create notes table
  community.postgresql.postgresql_table:
    name: notes
    state: present
    columns:
      - id serial primary key
      - title text
      - content text
      - created_at timestamp default CURRENT_TIMESTAMP
    login_host: 127.0.0.1
    login_db: "{{ postgresql_db_name }}"
    login_user: "{{ postgresql_db_user }}"
    login_password: "{{ db_user_passwd }}"

- name: Configure PostgreSQL listen addresses
  community.postgresql.postgresql_alter_system:
    param: listen_addresses
    value: "localhost,{{ ansible_host }}"
  become: true
  become_user: postgres
  notify: Restart postgresql

- name: Change rules in pg_hba.conf
  community.postgresql.postgresql_pg_hba:
    contype: host
    databases: "{{ postgresql_db_name }}"
    users: "{{ postgresql_db_user }}"
    address: "{{ hostvars[groups['web'][0]]['ansible_host'] }}/32"
    method: scram-sha-256
    dest: "{{ postgresql_hba_path }}"
    state: present
  notify: Reload postgresql

- name: Enable and start postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started