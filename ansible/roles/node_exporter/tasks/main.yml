---
- name: Create node_exporter user
  ansible.builtin.user:
    create_home: false
    name: node_exporter
    shell: "/usr/sbin/nologin"
    system: true
    state: present

- name: Check if node_exporter binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Download node_exporter archive on Ansible controller
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/{{ node_exporter_archive_name }}"
    checksum: "sha256:{{ node_exporter_checksum }}"
    timeout: 60
    mode: "0644"
  register: node_exporter_download
  retries: 3
  delay: 5
  until: node_exporter_download is succeeded
  delegate_to: localhost
  run_once: true
  become: false

- name: Copy node_exporter archive to containers
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_archive_name }}"
    dest: "/tmp/{{ node_exporter_archive_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Unarchive tar to dest folder
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_archive_name }}"
    remote_src: true
    dest: "/tmp"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_archive_dir }}/node_exporter"
    dest: "/usr/local/bin/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Copy unit file
  ansible.builtin.copy:
    src: node_exporter.service
    dest: "/etc/systemd/system/node_exporter.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true